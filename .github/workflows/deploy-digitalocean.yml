name: Deploy DigitalOcean Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create a plan for review, or apply a previously reviewed plan."
        required: true
        type: choice
        options:
          - plan
          - apply
          - inspect
        default: plan
      deployment_branch:
        description: "GitHub branch App Platform should build and deploy."
        required: true
        type: string
        default: main
      plan_run_id:
        description: "For apply only: run ID of a successful plan on this exact infrastructure-branch commit and deployment branch."
        required: false
        type: string
      confirm_plan:
        description: "Set to yes only after reviewing the plan and approving its estimated cost."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: no
      app_id:
        description: "For inspect only: DigitalOcean App Platform app UUID."
        required: false
        type: string
      deployment_id:
        description: "For inspect only: App Platform deployment UUID."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: digitalocean-terraform
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      inputs.operation == 'plan' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'digitalocean-production' || 'digitalocean-candidate' }}
    env:
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_operator_token: ${{ secrets.OPERATOR_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Check required credentials
        env:
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
        run: |
          test -n "$TF_VAR_digitalocean_token" || { echo "Missing DIGITALOCEAN_TOKEN secret"; exit 1; }
          test -n "$TF_VAR_operator_token" || { echo "Missing OPERATOR_TOKEN secret"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing DO_SPACES_ACCESS_KEY_ID secret"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing DO_SPACES_SECRET_ACCESS_KEY secret"; exit 1; }
          git check-ref-format --branch "$DEPLOYMENT_BRANCH" || {
            echo "deployment_branch must be a valid Git branch name."
            exit 1
          }
          git ls-remote --exit-code --heads origin "refs/heads/$DEPLOYMENT_BRANCH" > /dev/null || {
            echo "deployment_branch must exist in this GitHub repository."
            exit 1
          }
      - name: Initialize remote state
        run: terraform -chdir=terraform init -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=terraform validate
      - name: Create and summarize plan
        run: |
          terraform -chdir=terraform plan -input=false -no-color -out=tfplan
          terraform -chdir=terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$GITHUB_SHA" > terraform/plan-commit.txt
          printf '%s\n' "$DEPLOYMENT_BRANCH" > terraform/plan-deployment-branch.txt
          deployment_sha="$(git ls-remote --exit-code origin "refs/heads/$DEPLOYMENT_BRANCH" | cut -f1)"
          test -n "$deployment_sha" || {
            echo "Unable to resolve deployment branch commit."
            exit 1
          }
          printf '%s\n' "$deployment_sha" > terraform/plan-deployment-sha.txt
          {
            echo "## App source"
            echo
            echo "- Branch: \`$DEPLOYMENT_BRANCH\`"
            echo "- Commit: \`$deployment_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
          TF_VAR_github_branch: ${{ inputs.deployment_branch }}
      - uses: actions/upload-artifact@v4
        with:
          name: digitalocean-terraform-plan
          path: |
            terraform/tfplan
            terraform/plan-commit.txt
            terraform/plan-deployment-branch.txt
            terraform/plan-deployment-sha.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) &&
      inputs.operation == 'apply' &&
      inputs.confirm_plan == 'yes' &&
      inputs.plan_run_id != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'digitalocean-production' || 'digitalocean-candidate' }}
    env:
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_operator_token: ${{ secrets.OPERATOR_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Verify reviewed plan run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
        run: |
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "plan_run_id must be the numeric ID of a successful plan run."
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            '.head_branch == $branch and
             .head_sha == $sha and
             .status == "completed" and
             .conclusion == "success" and
             .path == ".github/workflows/deploy-digitalocean.yml"' \
            <<< "$run_json" > /dev/null
      - name: Initialize remote state
        run: terraform -chdir=terraform init -input=false -lockfile=readonly
      - uses: actions/download-artifact@v4
        with:
          name: digitalocean-terraform-plan
          path: terraform
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
      - name: Verify plan matches this commit
        env:
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
        run: |
          test "$(cat terraform/plan-commit.txt)" = "$GITHUB_SHA" || {
            echo "The reviewed plan was created from a different commit. Create and review a new plan."
            exit 1
          }
          test "$(cat terraform/plan-deployment-branch.txt)" = "$DEPLOYMENT_BRANCH" || {
            echo "The deployment branch differs from the reviewed plan. Create and review a new plan."
            exit 1
          }
          current_deployment_sha="$(git ls-remote --exit-code origin "refs/heads/$DEPLOYMENT_BRANCH" | cut -f1)"
          test "$(cat terraform/plan-deployment-sha.txt)" = "$current_deployment_sha" || {
            echo "The deployment branch changed after the plan. Create and review a new plan."
            exit 1
          }
      - name: Apply reviewed plan
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

  inspect:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      APP_ID: ${{ inputs.app_id }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
    steps:
      - name: Check inputs
        run: |
          test -n "$DIGITALOCEAN_TOKEN" || { echo "Missing DIGITALOCEAN_TOKEN secret"; exit 1; }
          [[ "$APP_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo "app_id must be a DigitalOcean app UUID."
            exit 1
          }
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo "deployment_id must be an App Platform deployment UUID."
            exit 1
          }
      - name: Fetch deployment status
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/apps/$APP_ID/deployments/$DEPLOYMENT_ID")"
          summary="$(jq -e --arg id "$DEPLOYMENT_ID" '
            .deployment
            | select(.id == $id)
            | {
                id,
                phase,
                cause,
                progress: {
                  pending_steps: .progress.pending_steps,
                  running_steps: .progress.running_steps,
                  success_steps: .progress.success_steps,
                  error_steps: .progress.error_steps,
                  steps: .progress.steps
                }
              }
          ' <<< "$response")"
          printf '%s\n' "$summary"
          {
            echo "## App Platform deployment"
            echo
            echo '```json'
            printf '%s\n' "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Fetch API deploy logs
        run: doctl apps logs "$APP_ID" api --type=deploy --deployment="$DEPLOYMENT_ID" --tail=100
